<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; background: #F5F5F7; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.group-label { font-size: 9px; color: #AEAEB2; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }

/* Primary */
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  background: #007AFF; color: white; border: none;
  border-radius: 8px; padding: 8px 20px;
  font: 600 13px/1 Inter,sans-serif; cursor: pointer;
  transition: background 120ms;
  letter-spacing: -0.01em;
}
.btn-primary:hover { background: #0063D1; }

/* Secondary */
.btn-secondary {
  display: inline-flex; align-items: center; gap: 6px;
  background: white; color: #1D1D1F;
  border: 1px solid #D2D2D7; border-radius: 8px;
  padding: 8px 18px; font: 500 12px/1 Inter,sans-serif; cursor: pointer;
}
.btn-secondary:hover { background: #F5F5F7; }

/* Ghost */
.btn-ghost {
  display: inline-flex; align-items: center; gap: 5px;
  background: transparent; color: #007AFF; border: none;
  padding: 6px 10px; font: 500 12px/1 Inter,sans-serif; cursor: pointer;
  border-radius: 6px;
}
.btn-ghost:hover { background: #EBF5FF; }

/* Danger */
.btn-danger {
  display: inline-flex; align-items: center; gap: 6px;
  background: #FF3B3010; color: #FF3B30;
  border: 1px solid #FF3B3030; border-radius: 8px;
  padding: 8px 16px; font: 500 12px/1 Inter,sans-serif; cursor: pointer;
}

/* Icon buttons (bottom row) */
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #E5E5EA; background: white;
  cursor: pointer; transition: background 120ms, border-color 120ms;
  flex-shrink: 0;
}
.icon-btn:hover { background: #F5F5F7; border-color: #D2D2D7; }
.icon-btn svg { display: block; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.state-tag {
  font-size: 9px; color: #AEAEB2; padding: 2px 6px;
  background: #F5F5F7; border-radius: 4px;
}
</style></head><body>

<div>
  <div class="group-label">Primary</div>
  <div class="row">
    <button class="btn-primary">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1v10M4 7l4 4 4-4"/><path d="M2 13h12"/></svg>
      Создать отчёт
    </button>
    <button class="btn-primary" style="background:#0063D1;">Hover</button>
    <button class="btn-primary" style="background:#E8E8ED;color:#AEAEB2;cursor:not-allowed;">Disabled</button>
    <span class="state-tag">height 34px · r-8 · 600</span>
  </div>
</div>

<div>
  <div class="group-label">Secondary &amp; Ghost</div>
  <div class="row">
    <button class="btn-secondary">Сохранить</button>
    <button class="btn-secondary">Отмена</button>
    <button class="btn-ghost">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v4M8 11v.5"/></svg>
      Подробнее
    </button>
    <button class="btn-danger">Удалить исходники</button>
  </div>
</div>

<div>
  <div class="group-label">Icon Buttons — Utility Actions</div>
  <div class="row">
    <!-- Clear -->
    <button class="icon-btn" title="Очистить">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </button>
    <!-- Settings -->
    <button class="icon-btn" title="Настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <!-- Folder open -->
    <button class="icon-btn" title="Открыть папку">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <!-- Upload -->
    <button class="icon-btn" title="Загрузить">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </button>
    <!-- AI sparkle -->
    <button class="icon-btn" title="AI режим" style="border-color:#007AFF30;background:#EBF5FF;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/>
      </svg>
    </button>
    <!-- Info -->
    <button class="icon-btn" title="Информация">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </button>
    <span class="state-tag">40×40 · r-10 · stroke 1.6</span>
  </div>
</div>

</body></html>
