<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; background: #F5F5F7; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.section { background: white; border: 1px solid #E5E5EA; border-radius: 8px; padding: 10px 12px; }
.lbl { font-size: 9px; color: #86868B; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.status-msg { font-size: 11px; color: #86868B; display: flex; align-items: center; gap: 6px; }
</style></head><body>
<div class="section">
  <div class="lbl">Status Badges</div>
  <div class="row">
    <span class="badge" style="background:#34C75918;color:#34C759;"><span class="dot" style="background:#34C759;"></span>PASS</span>
    <span class="badge" style="background:#FF3B3018;color:#FF3B30;"><span class="dot" style="background:#FF3B30;"></span>FAIL</span>
    <span class="badge" style="background:#FBBA1820;color:#9A7100;"><span class="dot" style="background:#FBBA18;"></span>WARN</span>
    <span class="badge" style="background:#007AFF18;color:#007AFF;"><span class="dot" style="background:#007AFF;"></span>IN PROGRESS</span>
    <span class="badge" style="background:#F5F5F7;color:#86868B;border:1px solid #E5E5EA;">БЛОКЕР</span>
    <span class="badge" style="background:#FF3B3010;color:#FF3B30;border:1px solid #FF3B3030;">ТРЕБУЕТ ИСПРАВЛЕНИЯ</span>
    <span class="badge" style="background:#F5F5F7;color:#86868B;border:1px solid #E5E5EA;">НОВЫЙ МАРКЕР</span>
  </div>
</div>
<div class="section">
  <div class="lbl">Status Messages</div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div class="status-msg">🔍 Анализ файлов...</div>
    <div class="status-msg">📊 Извлечение данных из PDF...</div>
    <div class="status-msg">📝 Генерация заключений...</div>
    <div class="status-msg">✅ Отчёт создан! &nbsp;<span style="color:#1D1D1F;font-weight:500;">Файлов: 4</span></div>
    <div class="status-msg" style="color:#FF3B30;">❌ Ollama недоступна. Проверьте, что Ollama запущена.</div>
  </div>
</div>
</body></html>
