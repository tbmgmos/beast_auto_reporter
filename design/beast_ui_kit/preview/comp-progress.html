<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; background: #F5F5F7; padding: 20px; }
.section { background: white; border: 1px solid #E5E5EA; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.group-label { font-size: 9px; color: #AEAEB2; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }

.step { display: flex; align-items: center; gap: 10px; }
.step-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.step-label { font-size: 11px; color: #86868B; }
.step-label.active { color: #1D1D1F; font-weight: 500; }
.step-label.done   { color: #34C759; font-weight: 500; }
.step-label.error  { color: #FF3B30; }
.track { height: 3px; background: #E5E5EA; border-radius: 9999px; overflow: hidden; }
.fill  { height: 100%; border-radius: 9999px; transition: width 0.4s ease; }
.pct   { font-size: 10px; color: #AEAEB2; width: 30px; text-align: right; flex-shrink: 0; }
.pct.done { color: #34C759; }
</style></head><body>
<div class="group-label">Progress Bar — Состояния</div>
<div class="section">

  <!-- Idle -->
  <div class="step">
    <div class="step-icon" style="background:#F5F5F7;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#AEAEB2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="8"/><line x1="8" y1="10.5" x2="8.01" y2="10.5"/>
      </svg>
    </div>
    <div class="step-info">
      <div class="step-label">Ожидание файлов</div>
      <div class="track"><div class="fill" style="width:0%;background:#E5E5EA;"></div></div>
    </div>
    <div class="pct">0%</div>
  </div>

  <!-- Copying -->
  <div class="step">
    <div class="step-icon" style="background:#EBF5FF;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="5" width="8" height="9" rx="1.5"/>
        <path d="M4 11H2.5A1.5 1.5 0 0 1 1 9.5v-7A1.5 1.5 0 0 1 2.5 1h7A1.5 1.5 0 0 1 11 2.5V4"/>
      </svg>
    </div>
    <div class="step-info">
      <div class="step-label active">Копирование файлов...</div>
      <div class="track"><div class="fill" style="width:10%;background:#007AFF;"></div></div>
    </div>
    <div class="pct">10%</div>
  </div>

  <!-- Analyzing -->
  <div class="step">
    <div class="step-icon" style="background:#EBF5FF;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="7" r="5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
      </svg>
    </div>
    <div class="step-info">
      <div class="step-label active">Анализ файлов...</div>
      <div class="track"><div class="fill" style="width:30%;background:#007AFF;"></div></div>
    </div>
    <div class="pct">30%</div>
  </div>

  <!-- PDF extraction -->
  <div class="step">
    <div class="step-icon" style="background:#EBF5FF;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="1" width="12" height="14" rx="1.5"/>
        <line x1="5" y1="5.5" x2="11" y2="5.5"/>
        <line x1="5" y1="8" x2="11" y2="8"/>
        <line x1="5" y1="10.5" x2="8" y2="10.5"/>
      </svg>
    </div>
    <div class="step-info">
      <div class="step-label active">Извлечение данных из PDF...</div>
      <div class="track"><div class="fill" style="width:55%;background:#007AFF;"></div></div>
    </div>
    <div class="pct">55%</div>
  </div>

  <!-- Generating -->
  <div class="step">
    <div class="step-icon" style="background:#EBF5FF;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 1l1.5 4.5H14l-3.8 2.8 1.5 4.5L8 10l-3.7 2.8 1.5-4.5L2 5.5h4.5z"/>
      </svg>
    </div>
    <div class="step-info">
      <div class="step-label active">Генерация заключений...</div>
      <div class="track"><div class="fill" style="width:80%;background:#007AFF;"></div></div>
    </div>
    <div class="pct">80%</div>
  </div>

  <!-- Done -->
  <div class="step">
    <div class="step-icon" style="background:#34C75918;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#34C759" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/><polyline points="5,8 7,10.5 11,6"/>
      </svg>
    </div>
    <div class="step-info">
      <div class="step-label done">Отчёт создан — Файлов: 4</div>
      <div class="track"><div class="fill" style="width:100%;background:#34C759;"></div></div>
    </div>
    <div class="pct done">100%</div>
  </div>

  <!-- Error -->
  <div class="step">
    <div class="step-icon" style="background:#FF3B3012;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#FF3B30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="8.5"/><line x1="8" y1="11" x2="8.01" y2="11"/>
      </svg>
    </div>
    <div class="step-info">
      <div class="step-label error">Ollama недоступна. Проверьте, что сервис запущен.</div>
      <div class="track"><div class="fill" style="width:35%;background:#FF3B30;"></div></div>
    </div>
    <div class="pct" style="color:#FF3B30;">35%</div>
  </div>

</div>
</body></html>
