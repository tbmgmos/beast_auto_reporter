<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; background: #F5F5F7; padding: 16px; }
.row { display: flex; gap: 8px; }
.swatch { flex: 1; border-radius: 8px; overflow: hidden; }
.block { height: 56px; }
.label { padding: 6px 8px; background: white; border: 1px solid #E5E5EA; border-top: none; border-radius: 0 0 8px 8px; }
.name { font-size: 10px; font-weight: 600; color: #1D1D1F; }
.hex  { font-size: 9px; color: #86868B; }
</style></head><body>
<div class="row">
  <div class="swatch">
    <div class="block" style="background:#F5F5F7;border:1px solid #E5E5EA;border-bottom:none;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Surface</div><div class="hex">#F5F5F7</div></div>
  </div>
  <div class="swatch">
    <div class="block" style="background:#E8E8ED;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Gray 100</div><div class="hex">#E8E8ED</div></div>
  </div>
  <div class="swatch">
    <div class="block" style="background:#E5E5EA;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Border Light</div><div class="hex">#E5E5EA</div></div>
  </div>
  <div class="swatch">
    <div class="block" style="background:#D2D2D7;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Border</div><div class="hex">#D2D2D7</div></div>
  </div>
  <div class="swatch">
    <div class="block" style="background:#AEAEB2;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Tertiary</div><div class="hex">#AEAEB2</div></div>
  </div>
  <div class="swatch">
    <div class="block" style="background:#86868B;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Secondary</div><div class="hex">#86868B</div></div>
  </div>
  <div class="swatch">
    <div class="block" style="background:#3D3D3D;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Gray 700</div><div class="hex">#3D3D3D</div></div>
  </div>
  <div class="swatch">
    <div class="block" style="background:#1D1D1F;border-radius:8px 8px 0 0;"></div>
    <div class="label"><div class="name">Primary Text</div><div class="hex">#1D1D1F</div></div>
  </div>
</div>
</body></html>
