<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; background: #F5F5F7; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 10px; }
.cell { background: white; border: 1px solid #E5E5EA; border-radius: 6px; padding: 8px 6px; text-align: center; }
.val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: #007AFF; }
.key { font-size: 9px; color: #86868B; margin-top: 2px; }
.bar-row { display: flex; gap: 4px; align-items: flex-end; height: 32px; margin-top: 8px; }
.bar { border-radius: 3px 3px 0 0; background: #E8E8ED; flex: 1; }
.bar-label { font-size: 9px; color: #86868B; text-align: center; display: block; }
</style></head><body>
<div class="grid">
  <div class="cell"><div class="val">2</div><div class="key">--space-1</div></div>
  <div class="cell"><div class="val">4</div><div class="key">--space-2</div></div>
  <div class="cell"><div class="val">6</div><div class="key">--space-3</div></div>
  <div class="cell"><div class="val">8</div><div class="key">--space-4</div></div>
  <div class="cell"><div class="val">10</div><div class="key">--space-5</div></div>
  <div class="cell"><div class="val">12</div><div class="key">--space-6</div></div>
  <div class="cell"><div class="val">16</div><div class="key">--space-8</div></div>
  <div class="cell"><div class="val">24</div><div class="key">--space-12</div></div>
</div>
<div class="bar-row">
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:4px;"></div><span class="bar-label">2px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:8px;"></div><span class="bar-label">4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:12px;background:#D2D2D7;"></div><span class="bar-label">6</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:16px;background:#D2D2D7;"></div><span class="bar-label">8</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:20px;background:#AEAEB2;"></div><span class="bar-label">10</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:24px;background:#86868B;"></div><span class="bar-label">12</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:28px;background:#007AFF;"></div><span class="bar-label">16</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;"><div class="bar" style="height:32px;background:#007AFF;"></div><span class="bar-label">24</span></div>
</div>
</body></html>
