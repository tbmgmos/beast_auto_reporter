<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; background: #F5F5F7; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.section { background: white; border: 1px solid #E5E5EA; border-radius: 10px; padding: 14px 16px; }
.group-label { font-size: 9px; color: #AEAEB2; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Text input */
.field-wrap { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 10px; color: #86868B; }
.field {
  border: 1px solid #D2D2D7; border-radius: 8px;
  padding: 7px 10px; font: 400 12px/1 Inter,sans-serif;
  color: #1D1D1F; outline: none; width: 160px;
  display: flex; align-items: center; gap: 7px;
}
.field.focused { border-color: #007AFF; box-shadow: 0 0 0 3px rgba(0,122,255,0.10); }
.field.readonly { background: #F5F5F7; color: #86868B; }
.field-text { flex: 1; font-size: 12px; }
.placeholder { color: #AEAEB2; }

/* Checkbox */
.cb-row { display: flex; flex-direction: column; gap: 8px; }
.cb-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.cb-box {
  width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 120ms;
}
.cb-box.unchecked { border: 1.5px solid #D2D2D7; background: white; }
.cb-box.checked   { border: none; background: #007AFF; }
.cb-box.disabled  { border: 1.5px solid #E5E5EA; background: #F5F5F7; }
.cb-label { font-size: 12px; color: #1D1D1F; }
.cb-label.disabled { color: #AEAEB2; }

/* Radio */
.rb-row { display: flex; flex-direction: column; gap: 8px; }
.rb-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.rb-ring {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.rb-ring.unchecked { border: 1.5px solid #D2D2D7; background: white; }
.rb-ring.checked   { border: none; background: #007AFF; }
.rb-dot { width: 7px; height: 7px; border-radius: 50%; background: white; }
.rb-label { font-size: 12px; color: #1D1D1F; }
.rb-tag { font-size: 10px; color: #AEAEB2; margin-left: 4px; }
</style></head><body>

<!-- Text Inputs -->
<div class="section">
  <div class="group-label">Text Input</div>
  <div class="row">
    <!-- Default -->
    <div class="field-wrap">
      <div class="field-label">Имя</div>
      <div class="field">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#AEAEB2" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c0-2.5 2.2-4 5-4s5 1.5 5 4"/></svg>
        <span class="field-text placeholder">Ваше имя</span>
      </div>
    </div>
    <!-- Focused -->
    <div class="field-wrap">
      <div class="field-label">Имя</div>
      <div class="field focused">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c0-2.5 2.2-4 5-4s5 1.5 5 4"/></svg>
        <span class="field-text" style="color:#1D1D1F;">Иван Петров</span>
      </div>
    </div>
    <!-- Folder (readonly) -->
    <div class="field-wrap">
      <div class="field-label">Папка</div>
      <div class="field readonly" style="width:140px;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#86868B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4.5A1.5 1.5 0 0 1 2.5 3h3.4l1.6 2H13.5A1.5 1.5 0 0 1 15 6.5v6A1.5 1.5 0 0 1 13.5 14h-11A1.5 1.5 0 0 1 1 12.5V4.5z"/></svg>
        <span class="field-text">Рабочий стол</span>
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#AEAEB2" stroke-width="1.5" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>
      </div>
    </div>
  </div>
</div>

<!-- Checkboxes -->
<div class="section">
  <div class="group-label">Checkboxes — Options</div>
  <div class="row" style="align-items:flex-start;">
    <div class="cb-row">
      <div class="cb-item">
        <div class="cb-box unchecked"></div>
        <span class="cb-label">
          <svg style="vertical-align:-2px;margin-right:4px;" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#86868B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5v4l2 2"/></svg>AI генерация
        </span>
      </div>
      <div class="cb-item">
        <div class="cb-box checked">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>
        </div>
        <span class="cb-label">
          <svg style="vertical-align:-2px;margin-right:4px;" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1l1.6 4.9H15l-4.1 3 1.6 4.9L8 11l-4.5 2.8 1.6-4.9L1 5.9h5.4z"/></svg>Full analyze
        </span>
      </div>
      <div class="cb-item">
        <div class="cb-box checked">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>
        </div>
        <span class="cb-label">
          <svg style="vertical-align:-2px;margin-right:4px;" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="1"/><circle cx="8" cy="8" r="5"/><line x1="8" y1="1" x2="8" y2="3"/></svg>TP verify
        </span>
      </div>
      <div class="cb-item" style="opacity:.45;">
        <div class="cb-box disabled"></div>
        <span class="cb-label disabled">Недоступно</span>
      </div>
    </div>

    <!-- Divider -->
    <div style="width:1px;background:#E5E5EA;align-self:stretch;margin:0 6px;"></div>

    <!-- Radio -->
    <div class="rb-row">
      <div class="rb-item">
        <div class="rb-ring checked"><div class="rb-dot"></div></div>
        <span class="rb-label">
          <svg style="vertical-align:-2px;margin-right:5px;" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"/><polyline points="5,8 7,10 11,6"/></svg>Основной
        </span>
      </div>
      <div class="rb-item">
        <div class="rb-ring unchecked"></div>
        <span class="rb-label">
          <svg style="vertical-align:-2px;margin-right:5px;" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#86868B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v8"/><path d="M1 13h14"/><path d="M7 8h2"/></svg>M&E
        </span>
      </div>
      <div class="rb-item">
        <div class="rb-ring unchecked"></div>
        <span class="rb-label">
          <svg style="vertical-align:-2px;margin-right:5px;" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#86868B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="14" height="10" rx="1.5"/><circle cx="8" cy="8" r="2"/></svg>TIFFLO
        </span>
      </div>
      <div class="rb-item">
        <div class="rb-ring unchecked"></div>
        <span class="rb-label">
          <svg style="vertical-align:-2px;margin-right:5px;" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#86868B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><polygon points="6.5,5.5 11.5,8 6.5,10.5"/></svg>DCP
        </span>
      </div>
    </div>
  </div>
</div>

</body></html>
